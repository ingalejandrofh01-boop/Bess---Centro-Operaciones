<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia Monitoreo BESS · Skysense</title>
<style>
/* ═══════════════ SKYSENSE · ACADEMIA MONITOREO BESS ═══════════════ */
:root{
  --blue:#0b2fb5; --blue2:#1a3fcc; --blue-lite:#3f6cff; --ink:#0a1430; --bg:#f3f6fc;
  --card:#ffffff; --b:#d8e2f5; --t2:#48597a; --t3:#8496b5; --green:#10b981; --red:#ef4444;
  --amber:#f59e0b; --teal:#0ea5a4; --violet:#7c3aed;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --disp:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
img{max-width:100%;display:block}
.hidden{display:none!important}

.topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}
.topbar img{height:22px}
.topbar .tb-r{display:flex;align-items:center;gap:14px}
.map-link{font-size:11px;color:var(--blue2);font-family:var(--mono);letter-spacing:1px;cursor:pointer;background:none;border:none;font-weight:700}
.map-link:hover{text-decoration:underline}
.sup-link{font-size:11px;color:var(--t3);font-family:var(--mono);letter-spacing:1px;cursor:pointer;text-decoration:none;background:none;border:none}
.sup-link:hover{color:var(--blue2)}

.prog{position:fixed;top:56px;left:0;right:0;height:4px;background:rgba(26,63,204,.08);z-index:49}
.prog-bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue-lite));transition:width .5s cubic-bezier(.4,0,.2,1)}

.stage{max-width:900px;margin:0 auto;padding:clamp(74px,9vh,104px) clamp(16px,4vw,34px) 60px;min-height:100vh}
.stage-hero,.stage-center{display:flex;flex-direction:column;justify-content:center}
.panel{background:var(--card);border:1px solid var(--b);border-radius:20px;padding:clamp(24px,3.4vw,46px);box-shadow:0 12px 44px rgba(11,47,181,.08)}
@media(min-width:1500px){.stage{max-width:1060px}}
.card-anim{animation:slideUp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes slideUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ── HERO ── */
.hero{position:relative;border-radius:24px;overflow:hidden;color:#fff;min-height:clamp(460px,72vh,700px);display:flex;flex-direction:column;justify-content:flex-end;
  padding:clamp(30px,4.5vw,56px) clamp(26px,4.5vw,58px);box-shadow:0 24px 60px rgba(11,47,181,.28)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.05);filter:saturate(1.05)}
.hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,16,45,.35) 0%,rgba(7,16,45,.55) 45%,rgba(9,16,38,.92) 100%)}
.hero-ov2{position:absolute;inset:0;background:radial-gradient(900px 400px at 15% 0%,rgba(63,108,255,.35),transparent 60%)}
.hero-content{position:relative}
.hero .kick{font-family:var(--mono);font-size:11px;letter-spacing:4px;text-transform:uppercase;opacity:.9;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hero h1{font-size:clamp(32px,4.8vw,58px);line-height:1.03;margin:0 0 16px;font-weight:800;letter-spacing:-1.2px;max-width:16ch}
.hero p{font-size:clamp(15px,1.5vw,20px);line-height:1.55;opacity:.92;max-width:56ch;margin:0 0 26px}
.spark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue-lite);box-shadow:0 0 0 4px rgba(63,108,255,.3);animation:float 2.4s ease-in-out infinite}

.btn{background:linear-gradient(135deg,var(--blue),var(--blue-lite));color:#fff;border:none;border-radius:14px;padding:15px 30px;font-size:15px;font-weight:700;
  cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 10px 26px rgba(26,63,204,.4);font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(26,63,204,.5)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.lg{padding:17px 40px;font-size:16px}
.btn.ghost{background:#fff;color:var(--blue2);border:1.5px solid var(--b);box-shadow:none}
.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}

.kick2{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--blue2);font-weight:700;margin-bottom:10px}
.h2{font-size:clamp(23px,3.2vw,33px);font-weight:800;letter-spacing:-.5px;margin:0 0 10px}
.lead{font-size:clamp(15px,1.7vw,17.5px);line-height:1.6;color:var(--t2);margin:0 0 22px;max-width:62ch}

.field{margin-bottom:22px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}
.field .hint{font-size:12.5px;color:var(--t3);font-weight:400;margin-top:-4px;margin-bottom:10px}
.inp{width:100%;padding:14px 16px;border:1.5px solid var(--b);border-radius:12px;font-size:15px;background:var(--card);color:var(--ink);font-family:inherit;transition:border .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 4px rgba(26,63,204,.1)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--card);border:1.5px solid var(--b);border-radius:30px;padding:10px 18px;font-size:13.5px;cursor:pointer;transition:all .15s;font-weight:600}
.chip:hover{border-color:var(--blue-lite);transform:translateY(-1px)}
.chip.sel{background:linear-gradient(135deg,var(--blue),var(--blue-lite));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(26,63,204,.3)}

.scene{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#0b1f4d,#13295e);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px}
.scene .emoji{font-size:30px;flex:0 0 auto;animation:float 3s ease-in-out infinite}
.scene p{margin:0;font-size:14.5px;line-height:1.5}
.scene b{color:#9fc0ff}

/* quiz */
.q-img{width:100%;height:clamp(190px,28vh,320px);object-fit:cover;border-radius:14px;margin-bottom:14px;border:1px solid var(--b)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.6px solid var(--b);border-radius:13px;padding:14px 16px;margin-bottom:9px;font-size:14.5px;cursor:pointer;transition:all .14s;font-family:inherit;color:inherit;font-weight:500}
.opt:hover{border-color:var(--blue-lite);transform:translateX(3px)}
.opt .dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--b);transition:all .14s}
.opt.sel .dot{border-color:var(--blue2);background:var(--blue2);box-shadow:inset 0 0 0 4px #fff}
.opt.correct{border-color:var(--green);background:rgba(16,185,129,.09)}
.opt.correct .dot{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 4px #fff}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.08)}
.qfb{font-size:13.5px;padding:11px 15px;border-radius:11px;margin-top:4px;line-height:1.55}
.qfb.ok{background:rgba(16,185,129,.1);color:#047857}
.qfb.no{background:rgba(26,63,204,.08);color:var(--blue2)}

/* bloques de lección */
.ind-flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:14px 0}
.ind-flow-box{flex:1;min-width:92px;text-align:center;background:var(--bg);border:1.5px solid var(--b);border-radius:12px;padding:12px 8px}
.ind-flow-box b{display:block;font-size:14px}
.ind-flow-box span{font-size:10px;color:var(--t3);font-family:var(--mono)}
.ind-flow-arr{display:flex;align-items:center;color:var(--blue2);font-weight:800;font-size:18px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.ind-term{background:var(--bg);border:1px solid var(--b);border-left:3px solid var(--blue2);border-radius:10px;padding:13px 15px}
.ind-term b{display:block;font-size:13.5px;margin-bottom:3px}
.ind-term span{font-size:12.5px;color:var(--t2);line-height:1.5}
.ind-note{background:rgba(26,63,204,.06);border:1px solid rgba(26,63,204,.18);border-radius:11px;padding:12px 15px;font-size:13.5px;line-height:1.55;color:var(--t2)}
.ind-note.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3)}
.ind-note.dang{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.28)}

.lesson-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.lesson-ic{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;flex:0 0 auto;box-shadow:0 8px 20px rgba(11,47,181,.25)}
.lesson-num{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--t3);text-transform:uppercase}
.sect-h{font-family:var(--disp);font-weight:800;font-size:clamp(16px,2vw,19px);margin:22px 0 6px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.lp{font-size:14.5px;line-height:1.65;color:var(--t2);margin:8px 0}
.lp b{color:var(--ink)}
.fig{width:100%;height:auto;margin:14px 0;border-radius:14px;border:1px solid var(--b);background:#fff;padding:12px 10px}
.fig-cap{font-size:11.5px;color:var(--t3);font-family:var(--mono);text-align:center;margin:-6px 0 14px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:6px 12px;border-radius:30px;background:rgba(26,63,204,.08);color:var(--blue2);border:1px solid rgba(26,63,204,.18)}
.brand-tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}
.brand-tbl th,.brand-tbl td{padding:9px 12px;border-bottom:1px solid var(--b);text-align:left}
.brand-tbl th{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.brand-tbl td b{color:var(--blue2)}
.brand-tbl tr:last-child td{border-bottom:none}

/* roadmap */
.map-head{text-align:center;margin-bottom:24px}
.map-head .h2{margin-bottom:6px}
.road{position:relative;max-width:640px;margin:0 auto}
.stop{display:flex;gap:16px;align-items:flex-start;position:relative;padding-bottom:16px}
.stop-rail{position:absolute;left:26px;top:54px;bottom:-2px;width:3px;background:var(--b);z-index:1}
.stop.done .stop-rail{background:var(--green)}
.stop:last-child .stop-rail{display:none}
.stop-ic{width:54px;height:54px;border-radius:17px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;position:relative;z-index:2;box-shadow:0 8px 18px rgba(11,47,181,.22)}
.stop.lock .stop-ic{filter:grayscale(.9);opacity:.5}
.stop-body{flex:1;background:var(--card);border:1.5px solid var(--b);border-radius:16px;padding:14px 16px;cursor:pointer;transition:all .16s}
.stop-body:hover{border-color:var(--blue-lite);transform:translateX(3px);box-shadow:0 8px 22px rgba(11,47,181,.1)}
.stop.lock .stop-body{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;border-color:var(--b)}
.stop-t{font-weight:800;font-size:15.5px;margin-bottom:2px}
.stop-s{font-size:12.5px;color:var(--t2);line-height:1.45}
.stop-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:9px;display:inline-block}
.b-done{background:rgba(16,185,129,.12);color:#047857}
.b-now{background:rgba(26,63,204,.1);color:var(--blue2)}
.b-lock{background:var(--bg);color:var(--t3)}

/* certificado */
.cert{position:relative;border-radius:16px;padding:clamp(30px,4.6vw,54px) clamp(22px,4vw,48px);text-align:center;overflow:hidden;
  background:linear-gradient(135deg,#fffdf6 0%,#eef3ff 100%);
  border:2px solid #caa94e;
  box-shadow:0 22px 60px rgba(11,47,181,.18), inset 0 0 0 6px rgba(202,169,78,.10), inset 0 0 0 7px rgba(255,255,255,.55)}
.cert::before{content:'';position:absolute;inset:11px;border:1.5px solid rgba(202,169,78,.5);border-radius:10px;pointer-events:none}
.cert::after{content:'';position:absolute;top:-70px;left:50%;transform:translateX(-50%);width:340px;height:170px;background:radial-gradient(circle,rgba(63,108,255,.14),transparent 70%);pointer-events:none}
.cert-in{position:relative}
.cert-kicker{font-family:var(--mono);letter-spacing:5px;font-size:10.5px;text-transform:uppercase;color:#b0862f;margin-bottom:6px}
.cert-title{font-size:clamp(24px,4.6vw,42px);font-weight:800;letter-spacing:5px;color:#0b2fb5;margin:0;text-transform:uppercase}
.cert-rule{width:72px;height:3px;border-radius:3px;background:linear-gradient(90deg,#caa94e,#f0d58a);margin:11px auto 16px}
.cert-seal{width:92px;height:92px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f6cff,#0b2fb5 72%);display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;box-shadow:0 12px 30px rgba(11,47,181,.4), 0 0 0 5px #fff, 0 0 0 7px rgba(202,169,78,.6);animation:pop .6s both}
.cert-pre{font-size:13px;color:var(--t2);margin:8px 0 0;letter-spacing:.5px}
.cert-name{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:clamp(28px,5.2vw,46px);color:#0b2fb5;margin:6px 0 2px;padding:0 18px 8px;display:inline-block;border-bottom:2px solid rgba(202,169,78,.45)}
.cert-line{font-size:13.5px;color:var(--t2);line-height:1.65;margin-top:12px}
.cert-scores{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0 4px}
.cert-sc{background:rgba(255,255,255,.72);border:1px solid rgba(202,169,78,.3);border-radius:12px;padding:9px 13px;min-width:84px}
.cert-sc b{display:block;font-size:18px;color:var(--blue2)}
.cert-sc span{font-size:9px;color:var(--t3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-top:24px;flex-wrap:wrap}
.cert-sig{flex:1;min-width:130px}
.cert-sig .ln{border-top:1.5px solid rgba(11,30,70,.35);margin:0 8px 6px;padding-top:6px}
.cert-sig small{display:block;font-size:10px;color:var(--t3);font-family:var(--mono);letter-spacing:.5px}
.cert-sig b{font-size:12.5px;color:var(--ink)}

.dots{display:flex;gap:7px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--b);transition:all .3s}
.dots i.on{background:var(--blue2);width:22px;border-radius:4px}

.done-wrap{text-align:center;padding:10px 0}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:60;pointer-events:none;border-radius:2px}

/* práctica (placeholder) */
.soon{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 12px,#eef2fb 12px,#eef2fb 24px);border:1.5px dashed var(--b);border-radius:14px;padding:16px;margin:10px 0}
.soon b{color:var(--blue2)}
.soon-item{background:#fff;border:1px solid var(--b);border-radius:10px;padding:11px 14px;margin:8px 0;font-size:13px;color:var(--t2)}
.soon-item b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}

/* supervisor */
.sup-wrap{max-width:1000px;margin:0 auto;padding:84px 18px 50px}
.sub-card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(11,47,181,.05)}
.sub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sub-name{font-weight:800;font-size:16px}
.sub-meta{font-family:var(--mono);font-size:11px;color:var(--t3)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.5px;padding:3px 9px;border-radius:20px;background:rgba(26,63,204,.08);color:var(--blue2);font-weight:700}
.mod-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mod-chip{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--b);color:var(--t2)}
.mod-chip b{color:var(--blue2)}
.qa{margin:8px 0;padding-left:12px;border-left:3px solid var(--b)}
.qa .qq{font-size:12px;color:var(--t3);font-weight:700;margin-bottom:2px}
.qa .aa{font-size:14px;line-height:1.5;white-space:pre-wrap}
.sup-stat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.sup-stat .s{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:12px 18px}
.sup-stat .s b{display:block;font-size:24px;color:var(--blue2)}
.sup-stat .s span{font-size:11px;color:var(--t3);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--green)}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.mode-note{font-size:12px;color:var(--t3);background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.3);border-radius:10px;padding:9px 13px;margin-top:14px;line-height:1.5}

.unit-prog{height:8px;background:var(--bg);border:1px solid var(--b);border-radius:20px;overflow:hidden;margin:14px 0 5px}
.unit-prog-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-lite));border-radius:20px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.unit-count{font-family:var(--mono);font-size:11px;color:var(--t3);text-align:right;margin-bottom:8px;letter-spacing:.3px}
.unit-count b{color:var(--blue2)}
@media(max-width:560px){.hero h1{font-size:29px}.h2{font-size:22px}.stage{padding:78px 14px 50px}.scene{flex-direction:column;text-align:center}.panel{padding:20px 16px}}
</style>
</head>

function figAlarm(){ return '<svg class="fig" viewBox="0 0 640 170" role="img" aria-label="Ciclo de una alarma">'+
  '<defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1a3fcc"/></marker></defs>'+
  ['Detección','Anunciación','Acuse (Ack)','Causa raíz','Reset'].map(function(t,i){ var x=20+i*124; var c=['#ef4444','#f59e0b','#1a3fcc','#7c3aed','#10b981'][i];
     return '<rect x="'+x+'" y="55" width="104" height="58" rx="11" fill="#fff" stroke="'+c+'" stroke-width="2"/>'+
            '<text x="'+(x+52)+'" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0a1430">'+(i+1)+'</text>'+
            '<text x="'+(x+52)+'" y="98" text-anchor="middle" font-size="10.5" fill="#48597a">'+t+'</text>'+
            (i<4?'<line x1="'+(x+104)+'" y1="84" x2="'+(x+124)+'" y2="84" stroke="#1a3fcc" stroke-width="2" marker-end="url(#ar2)"/>':''); }).join('')+
  '</svg><div class="fig-cap">El sistema detecta y anuncia → el operador acusa (Ack) → se atiende la causa física → recién entonces Reset.</div>'; }

function figBars(){ var data=[['Pylontech',109],['Hoy Ultra / Huawei',215],['Narada',250],['Hoy Core / Power',344],['CATL',372],['BYD',500]]; var max=500;
  var bars=data.map(function(d,i){ var w=d[1]/max*430; var y=18+i*28; var c=d[0].indexOf('BYD')>=0?'#1a3fcc':'#3f6cff';
    return '<text x="178" y="'+(y+13)+'" text-anchor="end" font-size="11" fill="#48597a">'+d[0]+'</text>'+
           '<rect x="186" y="'+y+'" width="'+w+'" height="18" rx="4" fill="'+c+'"/>'+
           '<text x="'+(186+w+6)+'" y="'+(y+13)+'" font-size="11" font-weight="700" fill="#1a3fcc">'+d[1]+(d[0]==='Narada'?'*':'')+'</text>'; }).join('');
  return '<svg class="fig" viewBox="0 0 640 195" role="img" aria-label="Capacidad por rack por marca">'+bars+
  '<text x="186" y="188" font-size="10" fill="#8496b5">kWh por rack  ·  *Narada varía por modelo (150 / 250 / 288 / 800)</text></svg>'+
  '<div class="fig-cap">Energía por rack según la marca. La energía total del sitio = (kWh por rack) × (número de racks).</div>'; }

  '</svg><div class="fig-cap">El sistema no descarga por debajo del SOC Mín ni carga por encima del SOC Máx: protege la vida de las celdas.</div>'; }

/* ════════════════ CONTENIDO DE LA ACADEMIA ════════════════ */
var MOD = [
 { id:'bess', num:1, icon:'⚡', color:'linear-gradient(135deg,#0b2fb5,#3f6cff)',
   title:'¿Qué es un BESS y para qué sirve?', sub:'El porqué de todo: hora punta, ahorro y recorte de pico',
   lesson:function(){ return ''+
    '<p class="lp">Un <b>BESS</b> (Battery Energy Storage System · Sistema de Almacenamiento de Energía en Baterías) es un sistema de baterías de gran escala que <b>guarda energía</b> cuando conviene y la <b>entrega</b> cuando se necesita. En Skysense <b>monitoreamos estos sistemas en tiempo real</b> en toda la República, para que operen seguros, estables y confiables.</p>'+
    '<div class="sect-h">🎯 ¿Para qué sirve? El negocio en una frase</div>'+
    '<p class="lp">La CFE cobra la energía más cara en la <b>hora punta</b> (las horas de mayor consumo del día). En esas horas el BESS <b>entrega la energía que tiene guardada</b>, así el sitio deja de tomar (o toma mucho menos) de la red justo en el momento más caro. A eso se le llama <b>recorte de picos de demanda</b> o <b>Peak Shaving</b>, y es la estrategia principal de la flota. Menos pico = menos costo en el recibo.</p>'+
    figPeak()+
    '<div class="sect-h">🧱 De lo más pequeño a lo más grande</div>'+
    '<div class="ind-flow">'+
      '<div class="ind-flow-box"><b>Celda</b><span>LFP · 3.2 V</span></div><div class="ind-flow-arr">→</div>'+
      '<div class="ind-flow-box"><b>Módulo</b><span>varias celdas</span></div><div class="ind-flow-arr">→</div>'+
      '<div class="ind-flow-box"><b>Rack</b><span>+ BMS</span></div><div class="ind-flow-arr">→</div>'+
      '<div class="ind-flow-box"><b>Contenedor</b><span>+ PCS + FSS</span></div>'+
    '</div>'+
    '<p class="lp">La <b>capacidad de diseño</b> de un sitio se calcula fácil: <b>(kWh por rack) × (número de racks)</b>. Ejemplo: 9 racks Hoy Core de 344 kWh ≈ <b>3,096 kWh</b>.</p>'+
    '<div class="ind-note warn">⚡ <b>kW vs kWh — no los confundas (esto es lo primero):</b> el <b>kW</b> es <b>potencia</b> (qué tan rápido entrega la energía). El <b>kWh</b> es <b>energía</b> (cuánta cabe en total). Una cubeta: los litros que le caben son la energía (kWh); qué tan rápido la vacías es la potencia (kW).</p></div>'+
    '<div class="ind-grid">'+
      '<div class="ind-term"><b>SOC — State of Charge</b><span>Cuánta energía hay disponible ahora, en % de la capacidad.</span></div>'+
      '<div class="ind-term"><b>SOH — State of Health</b><span>Salud de la batería: cuánta capacidad conserva respecto a la original.</span></div>'+
      '<div class="ind-term"><b>DOD — Depth of Discharge</b><span>Qué tan profundo se descargó en un evento.</span></div>'+
    '</div>'; },
   test:[
    {q:'Un banco se describe como "1,720 kWh / 450 kW". ¿Qué está diciendo cada número?', o:['1,720 kWh es la energía que almacena y 450 kW la potencia a la que la entrega','1,720 kW es la potencia y 450 kWh la energía acumulada','1,720 kWh es la energía de carga y 450 kWh la de descarga'], c:0, fb:'Los kWh son energía (cuánta cabe) y los kW son potencia (qué tan rápido se mueve). No se invierten ni se mezclan.'},
    {q:'¿Por qué el BESS descarga justo en hora punta y no en cualquier momento?', o:['Porque es la franja donde CFE cobra la demanda más cara; recortar ahí es donde se produce el ahorro','Porque fuera de hora punta el PCS no puede invertir de DC a AC','Porque en hora punta el SOC sube solo y conviene aprovecharlo'], c:0, fb:'Peak shaving ataca la franja más cara. El PCS puede invertir siempre, y el SOC no sube solo: sube al cargar.'},
    {q:'Un sitio tiene 5 racks Hoy Core de 344 kWh cada uno. ¿Capacidad de diseño aproximada?', o:['~1,720 kWh','~2,064 kWh','~1,032 kWh'], c:0, fb:'5 × 344 = 1,720 kWh. (2,064 sería 6 racks y 1,032 serían 3: cuidado con el número de racks.)'},
    {q:'El SOC de un banco marca 15%. ¿Qué significa exactamente?', o:['Le queda el 15% de la energía utilizable del banco en este momento','La batería conserva el 15% de su capacidad original','El banco está entregando el 15% de su potencia máxima'], c:0, fb:'SOC = energía disponible ahora. Conservar un % de la capacidad original es SOH, y el % de potencia es otra cosa.'},
    {q:'¿Qué describe el SOH (State of Health) de una batería?', o:['La capacidad que conserva hoy respecto a cuando era nueva','La energía disponible en este instante','El número de racks que están conectados al banco'], c:0, fb:'SOH es salud/desgaste. La energía disponible ahora es el SOC; los racks conectados es otro dato.'},
    {q:'¿Cuál es el orden correcto, de lo más pequeño a lo más grande?', o:['Celda → Módulo → Rack → Contenedor','Celda → Rack → Módulo → Contenedor','Módulo → Celda → Rack → Contenedor'], c:0, fb:'Las celdas forman módulos, los módulos forman racks (con su BMS) y los racks viven en el contenedor (con PCS y FSS).'}
   ] },

 { id:'disp', num:2, icon:'🧩', color:'linear-gradient(135deg,#3730a3,#6366f1)',
   title:'Anatomía: los dispositivos', sub:'BMS, PCS, transformador, medidor, controlador, FSS, HVAC…',
   lesson:function(){ return ''+
    '<p class="lp">Un BESS no es solo baterías. Es un conjunto de dispositivos que trabajan juntos. Conocer <b>qué hace cada uno</b> es la base para monitorear bien y entender cualquier alarma.</p>'+
    figArch()+
    '<div class="sect-h">🔋 Baterías, BMS, MBMS y BMU</div>'+
    '<p class="lp">Los <b>racks</b> de celdas se agrupan sobre un bus de corriente directa (DC). Cada rack tiene su propio <b>BMS</b> (Battery Management System), que vigila en tiempo real el <b>voltaje de cada celda, la corriente, las temperaturas y el aislamiento</b>, calcula el SOC/SOH y, si algo sale de rango, <b>abre los contactores y aísla el rack</b> para proteger el sistema. El <b>MBMS</b> es el BMS maestro: consolida la información de todos los racks. Dentro de cada rack hay varias <b>BMU</b> (Battery Monitoring Units) que leen a nivel de celda (en Hoy Core, 8 BMU por rack, por bus CAN).</p>'+
    '<div class="ind-note">🛡️ <b>El BMS tiene la última palabra.</b> Ante una celda fuera de límites (voltaje, temperatura o aislamiento bajo), desconecta el rack aunque todo lo demás esté bien. Es la capa de protección más importante.</p></div>'+
    '<div class="sect-h">🔄 PCS (inversor)</div>'+
    '<p class="lp">El <b>PCS</b> (Power Conversion System) convierte energía de forma <b>bidireccional</b>: rectifica <b>AC→DC</b> para cargar la batería e invierte <b>DC→AC</b> para descargarla. Recibe del controlador la consigna de <b>potencia activa (P, kW)</b> y <b>reactiva (Q, kVAr)</b>. Es el "traductor" entre la batería (DC) y la red (AC). En varios sitios son varias unidades en paralelo (p. ej. 210 kVA cada una).</p>'+
    '<div class="sect-h">🏭 Transformador e interconexión a la red</div>'+
    '<p class="lp">La barra AC del sitio conecta, a través del <b>transformador</b>, con la <b>red de CFE</b> en el <b>punto de interconexión</b> (operación <b>On-Grid</b>: sincronizado con la red). Ahí vive el <b>medidor</b> (p. ej. MIC-2 MkII), que mide voltajes, corrientes y energía del lado de la red y los reporta al controlador.</p>'+
    '<div class="sect-h">🧠 Controlador central y comunicaciones</div>'+
    '<p class="lp">El <b>controlador central (ASC)</b> recibe los datos del medidor, del PCS y de las baterías, y <b>ejecuta la estrategia</b> (modos, horarios, límites de SOC). Todo se enlaza por <b>RS-485/Modbus, bus CAN y TCP/IP</b>. <b>Si se pierde la comunicación</b>, el controlador pierde visibilidad y control: por eso una caída de comunicación se trata como alarma.</p>'+
    '<div class="ind-grid">'+
      '<div class="ind-term"><b>FSS — Supresión de incendio</b><span>Detecta humo/gas/temperatura y, si hace falta, libera el agente extintor. Indicadores: alarma, disparo (release) y falla.</span></div>'+
      '<div class="ind-term"><b>HVAC — Climatización</b><span>Mantiene fresco el gabinete de control y la electrónica. Trabaja junto al enfriamiento líquido de las celdas.</span></div>'+
      '<div class="ind-term"><b>UPS — Fuente de respaldo</b><span>Energiza la electrónica de control, el HMI y las comunicaciones aunque el PCS o la batería se caigan (respaldo ininterrumpido).</span></div>'+
    '</div>'; },
   test:[
    {img:'monitor', q:'Un rack se desconecta solo mientras el resto sigue operando normal. ¿Cuál es la causa más probable?', o:['Su BMS detectó una celda fuera de límites y abrió los contactores para proteger el banco','El PCS dejó de invertir y arrastró a ese rack','El SOC llegó al mínimo y el rack entró en reposo'], c:0, fb:'El BMS tiene la última palabra: aísla su propio rack ante una celda fuera de rango, sin afectar a los demás.'},
    {q:'¿Cuál describe mejor la función del PCS?', o:['Convierte DC↔AC de forma bidireccional y aplica la consigna de potencia activa y reactiva','Mide la energía del punto de red y la reporta al controlador','Almacena energía en condensadores cuando la batería está llena'], c:0, fb:'El PCS es el convertidor DC↔AC. Medir la red es tarea del medidor; el PCS no almacena energía.'},
    {q:'¿Qué hace el MBMS?', o:['Consolida la información de todos los racks: es el BMS maestro del banco','Es un BMS de respaldo que entra solo si un rack falla','Regula la climatización del banco a nivel de celda'], c:0, fb:'MBMS = BMS maestro: agrega lo que reporta cada rack. No es respaldo ni controla el clima.'},
    {q:'El sistema reporta "On-Grid". ¿Qué quiere decir?', o:['Opera interconectado y sincronizado con la red de CFE','Opera aislado, formando su propia red (isla)','Opera solo cargando, nunca descargando hacia la red'], c:0, fb:'On-Grid = conectado y sincronizado con la red. Formar su propia red sería operación en isla.'},
    {q:'¿Cuál de estos equipos es el FSS?', o:['El sistema de supresión de incendio del cuarto de baterías','El sistema de enfriamiento líquido de las celdas','La fuente que respalda la electrónica de control'], c:0, fb:'FSS = Fire Suppression System. El enfriamiento líquido es el chiller y el respaldo de electrónica es la UPS.'},
    {q:'En Hoy Core, ¿cómo se leen las variables a nivel de celda en un rack?', o:['Con varias BMU (8 por rack) enlazadas por bus CAN','Con un solo sensor maestro por contenedor vía RS-485','Con el medidor MIC-2, que lee celda por celda'], c:0, fb:'Cada rack Hoy Core usa 8 BMU por bus CAN. El MIC-2 mide la red, no las celdas.'},
    {q:'¿Cuál es la función de la UPS (fuente de respaldo)?', o:['Energiza la electrónica de control, el HMI y las comunicaciones aunque el PCS o la batería se caigan','Convierte la DC del banco en AC para el sitio','Mantiene la temperatura del gabinete de control'], c:0, fb:'La UPS da energía de respaldo a la supervisión. Convertir DC↔AC es el PCS; climatizar es el HVAC.'}
   ] },

 { id:'cap', num:3, icon:'📦', color:'linear-gradient(135deg,#0ea5a4,#2dd4bf)',
   title:'Marcas, capacidades y potencias', sub:'Cuánto guarda cada rack por marca · BYD = 500 kWh',
   lesson:function(){ return ''+
    '<p class="lp">No todas las baterías de la flota son iguales. La <b>energía por rack</b> depende de la <b>marca</b> (y a veces del modelo). Esto es clave: con el número de racks y la marca, sabes cuánta energía tiene un sitio.</p>'+
    figBars()+
    '<table class="brand-tbl"><tr><th>Marca</th><th>kWh por rack</th></tr>'+
      '<tr><td>Pylontech</td><td><b>109</b></td></tr>'+
      '<tr><td>Hoy Ultra / Huawei</td><td><b>215</b></td></tr>'+
      '<tr><td>Hoy Core / Hoy Power</td><td><b>344</b></td></tr>'+
      '<tr><td>CATL</td><td><b>372</b></td></tr>'+
      '<tr><td>BYD</td><td><b>500</b></td></tr>'+
      '<tr><td>Narada</td><td><b>varía por modelo</b> (150 / 250 / 288 / 800)</td></tr>'+
    '</table>'+
    '<div class="ind-note">🧮 <b>Energía total del sitio = kWh por rack × número de racks.</b> Ejemplo: 60 racks BYD de 500 kWh ≈ 30,000 kWh (30 MWh). La cifra exacta de cada sitio vive en la <b>Lista Maestra</b>.</p></div>'+
    '<div class="sect-h">⚙️ Potencia de carga y descarga</div>'+
    '<p class="lp">Además de la energía (kWh), cada sitio tiene su <b>potencia</b> (kW) de carga y descarga, que define qué tan rápido mueve esa energía. <b>Varía por sitio y por temporada</b> (invierno/verano), según la demanda real del cliente. La <b>potencia de descarga</b> suele ser mayor que la de carga.</p>'+
    '<div class="sect-h">🔋 Los límites de SOC protegen la batería</div>'+
    figSoc()+
    '<p class="lp">El sistema trabaja dentro de una ventana segura de SOC: no descarga por debajo del <b>SOC Mín</b> (evita descarga profunda) ni carga por encima del <b>SOC Máx</b> (evita sobrecarga). Hay además umbrales finos (SOC Thr) que suavizan la corriente cerca de los límites.</p>'; },
   test:[
    {q:'La marca Narada se comporta distinto al resto de la flota en cuanto a capacidad. ¿Por qué?', o:['Su energía por rack varía según el modelo (150, 250, 288 u 800 kWh)','Todos sus racks son siempre de 500 kWh','No usa racks, sino un solo bloque de baterías'], c:0, fb:'Narada aparece con varios modelos en la flota: su kWh por rack no es único, depende del modelo instalado.'},
    {img:'rack', q:'¿Cuántos kWh almacena un rack BYD?', o:['500 kWh por rack','372 kWh por rack','344 kWh por rack'], c:0, fb:'BYD = 500 kWh por rack. (372 es CATL y 344 es Hoy Core: son marcas distintas.)'},
    {q:'¿Y un rack Hoy Core / Hoy Power?', o:['344 kWh por rack','372 kWh por rack','215 kWh por rack'], c:0, fb:'Hoy Core / Hoy Power = 344 kWh. 372 es CATL y 215 es Hoy Ultra / Huawei.'},
    {q:'Dos sitios tienen 4 racks cada uno: uno es BYD y el otro Pylontech. ¿Cuál guarda más energía?', o:['El de BYD, porque su rack es de 500 kWh contra 109 kWh del Pylontech','El de Pylontech, porque sus celdas son más grandes','Guardan lo mismo: tienen el mismo número de racks'], c:0, fb:'A igual número de racks manda el kWh por rack de la marca: 4×500 (BYD) supera por mucho a 4×109 (Pylontech).'},
    {q:'¿Por qué es útil identificar la marca de un sitio antes de estimar su energía?', o:['Porque los kWh por rack dependen de la marca, y con eso conoces la energía del sitio','Porque la marca define el horario de la hora punta','Porque cada marca usa una estrategia de despacho distinta'], c:0, fb:'La marca fija los kWh por rack. El horario y la estrategia no dependen de la marca.'},
    {q:'¿Cuál es el propósito del SOC Mínimo?', o:['Evitar que el sistema descargue por debajo de él y así prevenir la descarga profunda','Limitar la corriente máxima de carga del banco','Fijar la potencia de descarga durante la hora punta'], c:0, fb:'El SOC Mín frena la descarga profunda (y el SOC Máx evita la sobrecarga). No fija corriente ni potencia.'}
   ] },

 { id:'estrat', num:4, icon:'🎛️', color:'linear-gradient(135deg,#b45309,#f59e0b)',
   title:'Estrategias y temporadas', sub:'Peak shaving vs potencia fija · Auto/Manual · verano/invierno',
   lesson:function(){ return ''+
    '<div class="sect-h">📉 Peak Shaving vs Potencia Fija</div>'+
    '<p class="lp"><b>Peak Shaving (recorte de picos):</b> el sistema vigila la demanda y <b>descarga solo cuando la demanda supera un umbral</b>, recortando el pico. La curva del BESS <b>"sigue" a la carga</b>: sube y baja. Es la estrategia normal de la flota.<br><b>Potencia Fija (valor fijo):</b> descarga (o carga) a un <b>valor constante en kW</b>, sin importar la demanda instantánea. En la curva se ve como una <b>línea plana</b>. Útil para arbitraje programado o como respaldo.</p>'+
    figPeak()+
    '<div class="sect-h">🕹️ Modos de control: Automático y Manual</div>'+
    '<div class="ind-grid">'+
      '<div class="ind-term"><b>Automático (Auto)</b><span>El controlador ejecuta solo la estrategia y los horarios. Es el modo normal de operación comercial.</span></div>'+
      '<div class="ind-term"><b>Manual</b><span>El operador toma control directo (Start/Stop, consignas). Se usa en pruebas, puesta en marcha o mantenimiento.</span></div>'+
    '</div>'+
    '<div class="sect-h">🔁 Estados: Standby, Carga y Descarga</div>'+
    '<div class="pill-row"><span class="pill">STANDBY · listo, sin intercambio</span><span class="pill">CARGA / CHARGE · toma energía (AC→DC)</span><span class="pill">DESCARGA / DISCHARGE · entrega energía (DC→AC)</span><span class="pill">SHUTDOWN / STOP · detenido</span><span class="pill">FAULT · falla, deja de operar</span></div>'+
    '<div class="sect-h">🌡️ Temporadas: invierno y verano</div>'+
    '<p class="lp">Manejamos dos temporadas. <b>La potencia configurada de cada sitio cambia por temporada</b>, porque la demanda del cliente y las tarifas de CFE son distintas. Además, <b>el horario de la hora punta también cambia</b> con la temporada (por eso se revisan los timers de descarga). En verano la demanda suele subir por el aire acondicionado.</p>'+
    '<div class="sect-h">📏 Demanda contratada — el límite que nunca se rebasa</div>'+
    '<p class="lp"><b>¿Qué es?</b> Es la <b>potencia máxima (en kW) que el cliente contrató con CFE</b> para su sitio: el "tope" de potencia que tiene derecho a tomar de la red.</p>'+
    '<p class="lp"><b>¿En qué se rige?</b> CFE mide la <b>demanda máxima</b> que registró el sitio en intervalos cortos (típicamente de 15 minutos) a lo largo del periodo, y la compara contra lo contratado. No importa el promedio: importa el <b>punto más alto</b> que alcanzó.</p>'+
    '<p class="lp"><b>¿Para qué nos sirve?</b> Es la <b>referencia del monitoreo</b>: el objetivo del peak shaving es justamente mantener la demanda que ve la red <b>por debajo</b> de ese límite. Por eso en la curva vigilamos que la RED no se acerque a la demanda contratada.</p>'+
    '<div class="ind-note dang">⚠️ <b>¿Por qué nunca excederla?</b> Si el sitio rebasa su demanda contratada —por ejemplo al <b>cargar</b> el BESS en mal momento—, CFE lo cobra caro: aplica <b>cargos por demanda</b> y hasta penalización por exceder lo contratado, y ese pico se factura aunque haya durado unos minutos. Cuidar que la <b>carga no sume un pico</b> por encima del límite es parte central del trabajo de monitoreo.</p></div>'; },
   test:[
    {q:'¿Cómo se distinguen peak shaving y potencia fija al mirar la curva del BESS?', o:['En peak shaving la potencia sube y baja siguiendo la demanda; en potencia fija es un valor constante (línea plana)','En peak shaving solo descarga y en potencia fija solo carga','Peak shaving opera en verano y potencia fija en invierno'], c:0, fb:'La diferencia es la forma: peak shaving sigue al pico; potencia fija entrega un kW constante. Ambas cargan y descargan y no dependen de la temporada.'},
    {q:'¿En cuál situación se usa el modo Manual?', o:['En pruebas, puesta en marcha o mantenimiento, con control directo del operador','En la operación comercial diaria, para respetar los horarios automáticos','Cuando se pierde la comunicación con el controlador central'], c:0, fb:'Auto es para el día a día; Manual es para intervenciones controladas. Perder comunicación no cambia el modo por sí solo.'},
    {q:'El PCS reporta estado "Carga". ¿Qué está haciendo?', o:['Toma energía de la red (AC→DC) para subir el SOC','Entrega energía al sitio invirtiendo DC→AC','Permanece sincronizado sin mover potencia activa'], c:0, fb:'Carga = rectifica AC→DC y sube el SOC. Entregar es Descarga, y quedarse sin mover potencia es Standby.'},
    {q:'¿Por qué un sitio tiene configurada distinta potencia en invierno y en verano?', o:['Porque la demanda del cliente y las tarifas de CFE cambian con la temporada','Porque en frío las celdas entregan más energía','Porque en verano se reduce el número de racks disponibles'], c:0, fb:'Es por demanda y tarifas, no por física de las celdas ni por quitar racks.'},
    {q:'Además de la potencia, ¿qué más suele ajustarse entre temporadas?', o:['El horario de la hora punta de CFE (y la demanda sube en verano por el A/C)','La marca de las baterías instaladas','El voltaje nominal de las celdas'], c:0, fb:'Las tarifas mueven el horario de hora punta, por eso se revisan los timers. La marca y el voltaje no cambian por temporada.'},
    {q:'Al CARGAR el BESS, la demanda que ve la red rebasa la demanda contratada. ¿Qué implica?', o:['El cliente puede incurrir en un cargo por demanda o penalización — por eso se vigila','El BESS se detiene y pasa automáticamente a descarga','CFE reduce la tarifa como compensación por el pico'], c:0, fb:'Rebasar la demanda contratada se factura caro. El BESS no se autodetiene por eso, y CFE no compensa: penaliza.'},
    {q:'En estado STANDBY, el sistema…', o:['Está energizado y sincronizado, listo, pero sin intercambio significativo de potencia activa','Está desconectado de la red para ahorrar energía','Está cargando lento para mantener el SOC al 100%'], c:0, fb:'Standby = listo y sincronizado, sin mover potencia. No está desconectado ni cargando.'}
   ] },

 { id:'mon', num:5, icon:'🖥️', color:'linear-gradient(135deg,#6d28d9,#a78bfa)',
   title:'Cómo se monitorea', sub:'HMI local · SkyLink (nube) · BESS Monitor (comunicación)',
   lesson:function(){ return ''+
    '<p class="lp">Monitoreamos cada sitio en <b>tres niveles</b> complementarios. Saber cuál usar para qué es parte del oficio.</p>'+
    '<div class="ind-grid">'+
      '<div class="ind-term"><b>1 · HMI Skysense (local)</b><span>Pantalla táctil en el tablero del sitio. Es el detalle operativo para el personal técnico en sitio.</span></div>'+
      '<div class="ind-term"><b>2 · SkyLink (nube)</b><span>Plataforma web: cualquier navegador con internet. Vista ejecutiva para cliente y dirección, reportes mensuales, ahorro, estadísticas y tendencias.</span></div>'+

 { id:'curvas', num:6, icon:'📈', color:'linear-gradient(135deg,#be123c,#fb7185)',

 { id:'alarm', num:7, icon:'🚨', color:'linear-gradient(135deg,#dc2626,#f87171)',

    '<div class="sect-h">⛔ Alarmas críticas vs. avisos</div>'+
    '<p class="lp"><b>Críticas:</b> las que nos dejan <b>sin poder accionar o controlar el sistema</b>, o que indican que un equipo dejó de operar. Las más importantes:</p>'+

      '<div class="ind-term" style="border-left-color:#dc2626"><b>Pérdida de comunicación con el PCS o el BMS</b><span>Crítica: sin comunicación no podemos accionar ni controlar el sistema.</span></div>'+
      '<div class="ind-term" style="border-left-color:#dc2626"><b>PCS apagado</b><span>Alarmante: el convertidor no está operando; el sitio deja de entregar o recibir energía. Suele ser <b>falla de contactor</b>: requiere <b>reseteo</b> porque el PDO quedó tripeado (disparado).</span></div>'+
      '<div class="ind-term" style="border-left-color:#dc2626"><b>PCS en falla (Fault)</b><span>Alarmante: el PCS se detuvo por una falla y deja de convertir energía.</span></div>'+
    '</div>'+
    '<p class="lp"><b>Avisos (no críticos):</b> condiciones informativas o menores que no ponen en riesgo la operación. Se <b>mencionan y se registran</b> para seguimiento, sin acción urgente.</p>'+
    '<div class="sect-h">🧭 Cómo quitar una alarma — el procedimiento</div>'+
    figAlarm()+
    '<p class="lp">En la pantalla de <b>Alarmas</b>: <b>1)</b> revisa qué alarmas hay y su severidad; <b>2) selecciona</b> la(s) alarma(s); <b>3)</b> dale <b>Ack</b> (acuse de recibo); <b>4)</b> dale <b>Reset</b>. Después, <b>5)</b> ve a <b>Configuración</b> y dale <b>Reset</b> también, para rearmar el sistema por completo.</p>'+
    '<div class="ind-note warn">🔑 <b>El Reset solo rearma; la causa debe estar resuelta antes.</b> Si la alarma vuelve a saltar después del Reset (en Alarmas y en Configuración), la condición de fondo sigue presente.</p></div>'+
    '<div class="sect-h">🆘 Qué hacer según la severidad</div>'+

      '<div class="ind-term"><b>Si es crítica</b><span>Se escala con el jefe y, si no se resuelve en remoto, se pide apoyo en sitio o se acude a atenderla físicamente.</span></div>'+
    '</div>'; },
   test:[
    {q:'Llegas a la pantalla de Alarmas y hay varias activas. ¿Qué es lo primero que haces?', o:['Revisar qué alarmas hay y clasificar su severidad: si son críticas o solo avisos','Darle Reset a todas de inmediato para limpiarlas','Reiniciar el HMI para que desaparezcan'], c:0, fb:'Primero se lee y se clasifica (crítica vs aviso); eso define la acción. No se resetea a ciegas.'},
    {q:'¿Cuál es el procedimiento correcto para quitar una alarma?', o:['Seleccionarla → Ack → Reset, y luego ir a Configuración y dar Reset también','Darle Reset directo en Configuración, sin acusarla','Darle Ack y dejarla así, sin Reset'], c:0, fb:'El flujo completo: seleccionar → Ack → Reset en Alarmas, y después Reset en Configuración para rearmar todo.'},
    {q:'¿Cuál de estas es una alarma CRÍTICA?', o:['Pérdida de comunicación con el PCS o el BMS','Un aviso informativo de rutina','Una lectura que está dentro de su rango normal'], c:0, fb:'Perder comunicación con el PCS o el BMS es crítico: sin comunicación no podemos accionar ni controlar el sistema.'},
    {q:'¿Por qué la pérdida de comunicación con el BMS o el PCS se considera crítica?', o:['Porque sin comunicación no podemos accionar ni controlar el sistema','Porque la batería se descarga sola de inmediato','Porque CFE corta el suministro al sitio'], c:0, fb:'Lo crítico es quedarnos sin capacidad de accionar/controlar el equipo, no una descarga ni un corte de CFE.'},

    {q:'Una alarma crítica no se resuelve de forma remota. ¿Qué sigue?', o:['Escalarla con el jefe y, si hace falta, pedir apoyo en sitio o acudir a atenderla físicamente','Resetearla varias veces hasta que deje de aparecer','Silenciar las alarmas del sitio por el resto del turno'], c:0, fb:'Crítica sin solución remota → escalar con el jefe y apoyo/atención en sitio. Resetear o silenciar no corrige la causa.'},

 { id:'solar', num:8, icon:'☀️', color:'linear-gradient(135deg,#059669,#34d399)',
   title:'Sistema híbrido con solar', sub:'Fotovoltaico + BESS: la sinergia',
   lesson:function(){ return ''+
    '<p class="lp">Algunos sitios combinan el BESS con <b>paneles solares (fotovoltaico)</b>. Conviene entender lo básico del solar y por qué se complementan tan bien.</p>'+
    '<div class="sect-h">🔆 Cómo funciona el solar</div>'+
    '<p class="lp">El <b>panel</b> genera <b>corriente directa (CD/DC)</b> a partir de la luz. El <b>inversor</b> la convierte en <b>corriente alterna (CA/AC)</b> para usarla en el sitio o la red — es el <b>mismo principio del PCS</b> de un BESS. Cuánta energía produce depende de la <b>irradiación solar</b>: a mayor sol directo, más energía. <b>De noche no genera.</b></p>'+
    '<div class="ind-flow">'+
      '<div class="ind-flow-box"><b>Sol</b><span>irradiación</span></div><div class="ind-flow-arr">→</div>'+
      '<div class="ind-flow-box"><b>Panel</b><span>genera CD</span></div><div class="ind-flow-arr">→</div>'+
      '<div class="ind-flow-box"><b>Inversor</b><span>CD → CA</span></div><div class="ind-flow-arr">→</div>'+
      '<div class="ind-flow-box"><b>Sitio / BESS</b><span>consumo o guarda</span></div>'+
    '</div>'+
    '<div class="sect-h">🤝 ¿Por qué BESS + solar se complementan?</div>'+
    '<div class="ind-note">☀️🔋 El solar produce de día, pero la hora punta cara suele ser al caer la tarde/noche. El <b>BESS guarda el excedente solar del día</b> y lo <b>libera en hora punta</b> o cuando ya no hay sol. Así se aprovecha energía limpia justo cuando más cuesta — una de las grandes sinergias.</p></div>'; },
   test:[
    {q:'En un sistema fotovoltaico, ¿cuál es la función del inversor?', o:['Convertir la corriente directa (CD) de los paneles en alterna (CA) utilizable','Almacenar la energía del sol para usarla de noche','Elevar el voltaje de los paneles antes de entrar a la batería'], c:0, fb:'El inversor hace CD→CA (mismo principio que el PCS). Almacenar es tarea de la batería, no del inversor.'},
    {q:'¿De qué depende principalmente cuánta energía produce un sistema solar?', o:['De la irradiación solar (sol directo y cielo despejado)','Del estado de carga de las baterías del sitio','De la temperatura ambiente, únicamente'], c:0, fb:'Depende de la irradiación. El SOC de las baterías no cambia la generación del panel.'},
    {q:'¿Por qué el BESS y el solar se complementan tan bien?', o:['El BESS guarda el excedente solar del día para usarlo en hora punta o cuando ya no hay sol','Porque el solar carga la batería más rápido que la red','Porque ambos reducen la temperatura de operación del sitio'], c:0, fb:'La sinergia es temporal: se guarda energía del día y se libera cuando más cuesta. No es cuestión de velocidad ni de temperatura.'},
    {q:'¿Qué genera un panel solar durante la noche?', o:['Prácticamente nada: sin irradiación no hay generación','Lo mismo que de día, si el inversor sigue encendido','Algo, a partir del calor acumulado en los paneles'], c:0, fb:'Sin sol no genera; por eso el BESS cubre la noche con la energía guardada. El calor no genera electricidad en un panel.'},
    {q:'La corriente que entrega directamente un panel solar es…', o:['Corriente directa (CD/DC)','Corriente alterna (CA/AC), lista para la red','CD de día y CA de noche, según la irradiación'], c:0, fb:'El panel entrega siempre CD; el inversor la convierte en CA. No cambia de tipo según la hora.'}
   ] }
];

var S = { name:'', nivel:{}, open:{}, modDone:{}, modScore:{}, quiz:{} };
var VIEW='hero', openIdx=0, MI=0, TI=0;

function qs(id){return document.getElementById(id);}
function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function modsDoneCount(){ return MOD.filter(function(m){return S.modDone[m.id];}).length; }
function allDone(){ return modsDoneCount()===MOD.length; }
/* ¿Ya llenó los datos del inicio (nombre + rol + experiencia)? Si sí, no se le vuelve
   a pedir: entra directo a su ruta. Vale también para quien ya lo llenó antes. */
function profileDone(){ return !!S.introDone || (!!S.name && !!(S.nivel && S.nivel.rol && S.nivel.sabeBess && S.nivel.sabePv)); }
/* Identidad que la persona ya creó en Centro BESS (mismo origen): su nombre y avatar.
   No usamos los genéricos (admin/operador/supervisor) — esos no son un nombre real. */
function appAvatar(){ try{
  var n=localStorage.getItem('bess_uname');
  if(!n || ['operador','admin','supervisor',''].indexOf(n.trim().toLowerCase())>=0) return null;
  var av=localStorage.getItem('bess_uavatar')||'';
  var color=localStorage.getItem('bess_ucolor')||'#1a3fcc';
  var parts=n.trim().split(' ').filter(Boolean);
  var ini=(parts.length>=2?parts[0][0]+parts[parts.length-1][0]:n.slice(0,2)).toUpperCase();
  return {txt:av||ini, color:color, name:n};
}catch(e){ return null; } }
/* Un nombre genérico (admin/operador…) NO es un nombre real: no debe quedarse como identidad. */
function isGenericName(n){ return !String(n||'').trim() || ['admin','operador','supervisor','usuario','user','administrador'].indexOf(String(n).trim().toLowerCase())>=0; }
/* Admin = tu cuenta (misma lógica que la app). Solo tú ves la opción de supervisor. */
function _isAdmin(){ try{ if(localStorage.getItem('bess_admin')==='1') return true; var n=(localStorage.getItem('bess_uname')||'').trim().toLowerCase(); return ['admin','alejandro','alejandro fernandez','ing. ale','ale','ing. alejandro','ing alejandro'].indexOf(n)>=0; }catch(e){ return false; } }

function setProg(){
  var total=MOD.length+2; var done=modsDoneCount();
  var base = (VIEW==='hero'||VIEW==='nombre'||VIEW==='nivel'||VIEW==='open')?0:(VIEW==='final'?total:done+1);
  var p=Math.min(100, base/total*100); qs('prog').style.width=p+'%';
  var d=qs('dots'); if(d){ d.innerHTML=MOD.map(function(m){return '<i class="'+(S.modDone[m.id]?'on':'')+'"></i>';}).join(''); }
  qs('map-link').classList.toggle('hidden', !(VIEW!=='hero'&&VIEW!=='nombre'&&VIEW!=='nivel'&&VIEW!=='open'));
}

  var st=qs('stage'), h='';
  if(VIEW==='hero'){
    h='<div class="hero card-anim"><div class="hero-bg" style="background-image:url('+IMG.hero+')"></div>'+
      '<div class="hero-ov"></div><div class="hero-ov2"></div><div class="hero-content">'+

function tkey(){ return MOD[MI].id+'_'+TI; }
function renderTest(){
  var m=MOD[MI], set=m.test, z=set[TI], gkey=tkey(), graded=S.quiz[gkey]&&S.quiz[gkey].graded;
  var h='<div class="card-anim"><div class="lesson-head"><div class="lesson-ic" style="background:'+m.color+';width:44px;height:44px;font-size:21px">'+m.icon+'</div>'+

  if(z.img&&IMG[z.img]) h+='<img class="q-img" src="'+IMG[z.img]+'" alt="">';
  h+='<h2 class="h2" style="font-size:clamp(18px,2.4vw,24px);margin-top:14px">'+z.q+'</h2>';
  z.o.forEach(function(opt,oi){
    var cls='opt', sel=S.quiz[gkey]&&S.quiz[gkey].pick===oi;
    if(graded){ if(oi===z.c)cls+=' correct'; else if(sel)cls+=' wrong'; }
    else if(sel)cls+=' sel';
    var click=graded?'':('onclick="tPick('+oi+')"');
    h+='<button class="'+cls+'" '+click+'><span class="dot"></span>'+esc(opt)+'</button>';
  });
  if(graded){ var ok=S.quiz[gkey].pick===z.c;
    var msg = ok ? ('✅ <b>Correcto.</b> '+z.fb)
      : ('❌ <b>Esa no es.</b> La que elegiste no es la respuesta; la correcta es la marcada en <b>verde</b>: «'+esc(z.o[z.c])+'». '+z.fb);
    h+='<div class="qfb '+(ok?'ok':'no')+'">'+msg+'</div>'; }
  var last=TI>=set.length-1;
  var nextLbl=graded?(last?'Terminar parada →':'Siguiente →'):'Revisar';
  var dis=(!graded && (!S.quiz[gkey]||S.quiz[gkey].pick==null))?' disabled':'';
  h+='<div class="btn-row"><button class="btn ghost" onclick="tBack()">← Atrás</button>'+
    '<button class="btn"'+dis+' onclick="tNext()">'+nextLbl+'</button></div></div>';

window.tNext=function(){
  var m=MOD[MI], set=m.test, k=tkey();
  if(!S.quiz[k]||S.quiz[k].pick==null)return;
  if(!S.quiz[k].graded){ S.quiz[k].graded=true; render(); return; }
  if(TI<set.length-1){ TI++; render(); window.scrollTo(0,0); }
  else { // termina parada
    var score=0; set.forEach(function(z,i){ var q=S.quiz[m.id+'_'+i]; if(q&&q.pick===z.c)score++; });
    S.modScore[m.id]=score; S.modDone[m.id]=true;
    saveProgress();
    go('map');
    _acaSync();
    try{ miniConfetti(); }catch(e){}
  }
};

/* Descargar el diploma como PNG o PDF (carga las librerías solo cuando se usa). */
function _loadLib(src, test, cb){ if(test()){ cb(); return; } var s=document.createElement('script'); s.src=src; s.onload=function(){ cb(); }; s.onerror=function(){ cb('err'); }; document.head.appendChild(s); }
window._diplomaDL=function(kind){
  var el=document.getElementById('diploma'); if(!el) return;
  _loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', function(){return !!window.html2canvas;}, function(){
    if(!window.html2canvas){ alert('No se pudo cargar el generador de imagen (revisa tu conexión).'); return; }
    var render=function(){
      window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(function(canvas){
        var fname='Diploma_'+String(S.name||'Academia').replace(/[^\w]+/g,'_')+'_'+new Date().toISOString().slice(0,10);
        if(kind==='png'){ var a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=fname+'.png'; document.body.appendChild(a); a.click(); a.remove(); }
        else { var J=window.jspdf&&window.jspdf.jsPDF; if(!J){ alert('No se pudo cargar el PDF.'); return; }
          var orient=canvas.width>=canvas.height?'landscape':'portrait';
          var doc=new J({unit:'pt',format:'a4',orientation:orient});
          var pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight(), m=24;
          var r=canvas.width/canvas.height, w=pw-m*2, h=w/r; if(h>ph-m*2){ h=ph-m*2; w=h*r; }
          doc.addImage(canvas.toDataURL('image/jpeg',0.96),'JPEG',(pw-w)/2,(ph-h)/2,w,h);
          doc.save(fname+'.pdf');
        }
      }).catch(function(err){ alert('No se pudo generar el diploma: '+(err&&err.message||err)); });
    };
    if(kind==='pdf'){ _loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', function(){return !!(window.jspdf&&window.jspdf.jsPDF);}, render); }
    else render();
  });
};

  if(!confirm('¿Volver a hacer la prueba desde la primera parada? Tus respuestas de los tests se reinician y, al terminar, se vuelve a enviar el aviso a tu supervisor.')) return;
  S.modDone={}; S.modScore={}; S.quiz={}; S.submitted=false; S._sent=false;

  VIEW='map'; render(); window.scrollTo(0,0);

};

/* ---- confetti ---- */
function confetti(){
  var cols=['#1a3fcc','#3f6cff','#10b981','#f59e0b','#ef4444'];
  for(var i=0;i<90;i++){(function(i){
    var c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.transform='rotate('+Math.random()*360+'deg)';
    document.body.appendChild(c);
    var dur=2200+Math.random()*1500;
    c.animate([{transform:'translateY(-10px) rotate(0)',opacity:1},{transform:'translateY(100vh) rotate('+(360+Math.random()*360)+'deg)',opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.4,1)'});
    setTimeout(function(){c.remove();},dur);
  })(i);}
}
function miniConfetti(){ var cols=['#10b981','#3f6cff','#f59e0b'];
  for(var i=0;i<28;i++){(function(i){ var c=document.createElement('div');c.className='confetti';
    c.style.left=(40+Math.random()*20)+'vw';c.style.background=cols[i%cols.length];
    document.body.appendChild(c); var dur=1400+Math.random()*900;
    c.animate([{transform:'translateY(-10px)',opacity:1},{transform:'translateY(70vh) rotate(360deg)',opacity:.8}],{duration:dur,easing:'ease-out'});
    setTimeout(function(){c.remove();},dur); })(i);}
}

/* ════════ AVANCE EN VIVO → app (admin ve quién va, en qué test, tiempos) ════════
   Se escribe en la colección academia_induccion (mismo Firebase que la app).
   Un documento por persona (id estable), que se va actualizando conforme avanza. */
var ACA_ID=(function(){ try{ var id=localStorage.getItem('bess_uid')||localStorage.getItem('aca_uid'); if(!id){ id='aca_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); localStorage.setItem('aca_uid',id); } return id; }catch(e){ return 'aca_'+Date.now().toString(36); } })();
function _acaStartTs(){ try{ var t=localStorage.getItem('aca_startTs'); if(!t){ t=String(Date.now()); localStorage.setItem('aca_startTs',t); } return parseInt(t,10); }catch(e){ return Date.now(); } }
function _acaSync(opts){
  opts=opts||{};
  if(!FB_ON || !db) return;
  try{
    var now=Date.now(), startTs=_acaStartTs();
    var curMod=MOD[MI]||null, ts=totalScore();
    var ACA_SHORT={bess:'¿Qué es un BESS?',disp:'Dispositivos',cap:'Capacidades',estrat:'Estrategias',mon:'Monitoreo',curvas:'Lectura de curvas',alarm:'Alarmas',solar:'Solar'};
    var modDetail=MOD.map(function(m){ return {num:m.num, id:m.id, t:(ACA_SHORT[m.id]||m.title), s:(S.modScore&&S.modScore[m.id]!=null?S.modScore[m.id]:null), tot:m.test.length}; });
    var etapa = VIEW==='final' ? 'Terminó'
      : VIEW==='test' ? ('Test — Parada '+(curMod?curMod.num:'')+': '+(curMod?curMod.title:''))
      : VIEW==='lesson' ? ('Lección — Parada '+(curMod?curMod.num:'')+': '+(curMod?curMod.title:''))
      : VIEW==='map' ? 'En la ruta'
      : 'En el inicio';
    var doc={
      id:ACA_ID, nombre:S.name||'Sin nombre', rol:(S.nivel&&S.nivel.rol)||'',
      nivel:{elec:(S.nivel&&S.nivel.elec)||'', sabeBess:(S.nivel&&S.nivel.sabeBess)||'', sabePv:(S.nivel&&S.nivel.sabePv)||''},
      status: opts.finished?'terminado':'en_curso',
      etapa: etapa, vista: VIEW,
      paradaActualNum: curMod?curMod.num:null,
      modulosHechos: modsDoneCount(), modulosTotal: MOD.length,
      modScores: S.modScore||{}, modDetail: modDetail, scoreTotal: ts.s, scoreMax: ts.t,
      respuestas: S.open||{},
      startedAt: new Date(startTs).toISOString(), startedTs: startTs,
      lastUpdate: new Date(now).toISOString(), lastUpdateTs: now
    };
    if(opts.finished){ doc.finishedAt=new Date(now).toISOString(); doc.finishedTs=now; doc.durationMin=Math.max(1, Math.round((now-startTs)/60000)); }
    db.collection('academia_induccion').doc(ACA_ID).set(doc, {merge:true}).catch(function(e){ console.warn('[aca-sync]', e&&e.message); });
  }catch(e){ console.warn('[aca-sync]', e); }
}
window._acaSync=_acaSync;
function payload(){
  var mods=MOD.map(function(m){ return {id:m.id, num:m.num, title:m.title, score:(S.modScore[m.id]||0), total:m.test.length}; });
  var ts=totalScore();
  return { nombre:S.name, rol:S.nivel.rol||'',
    nivel:{elec:S.nivel.elec||'', sabeBess:S.nivel.sabeBess||'', sabePv:S.nivel.sabePv||'', graf:S.nivel.graf||''},
    respuestas:S.open, modulos:mods, scoreTotal:ts.s, scoreMax:ts.t,
    ts:Date.now(), fecha:new Date().toISOString(), tipo:'academia_v2' };
}
function submit(){
  saveProgress();
  var data=payload();
  try{ var arr=JSON.parse(localStorage.getItem('sky_induccion')||'[]'); arr.push(data); localStorage.setItem('sky_induccion',JSON.stringify(arr)); }catch(e){}
  if(FB_ON&&db){
    db.collection('respuestas_induccion').add(data).then(function(){ setSaveState('✓ Enviado a tu supervisor'); })
      .catch(function(e){ setSaveState('Guardado local (sin conexión a la nube)'); });
  } else { setSaveState(FIREBASE_CONFIG.apiKey?'Guardado':'✓ Guardado (modo local)'); }
  sendEmailNotif(data);
  _acaSync({finished:true});
}
function sendEmailNotif(data){
  var nv=data.nivel||{};
  var caso=(data.respuestas&&data.respuestas.q_caso)||'(sin respuesta)';
  var resumen=data.modulos.map(function(m){return m.num+'·'+m.score+'/'+m.total;}).join('  ');
  var mensaje=(data.nombre||'Alguien')+' ('+(data.rol||'—')+') completó la Academia Monitoreo BESS.\n'+
    'Base eléctrica: '+(nv.elec||'?')+' · Sabe BESS: '+(nv.sabeBess||'?')+' · Sabe solar: '+(nv.sabePv||'?')+'\n'+
    'Puntaje global: '+data.scoreTotal+'/'+data.scoreMax+'\nPor parada: '+resumen+'\n'+
    'Caso (rack 0 A): '+caso+'\n\nAbre el Panel de supervisor para ver el detalle.';
  var nombreP=data.nombre||'Sin nombre';
  var nivelP=(nv.elec||'?')+' · BESS '+(nv.sabeBess||'?')+' · Solar '+(nv.sabePv||'?');
  var scoreP=data.scoreTotal+'/'+data.scoreMax;
  var fechaP=new Date(data.ts).toLocaleString('es-MX');
  if(!EMAILJS_CONFIG.publicKey || !EMAILJS_CONFIG.serviceId || !EMAILJS_CONFIG.templateId){
    console.warn('[EmailJS] faltan llaves (publicKey/serviceId/templateId).'); return; }
  if(typeof emailjs==='undefined'){
    console.warn('[EmailJS] la librería no cargó (revisa conexión).');
    setSaveState('⚠ El correo no se envió: la librería de EmailJS no cargó.'); return; }
  var params={
    /* destinatario (varias convenciones de EmailJS) */
    to_email: NOTIFY_EMAIL, email: NOTIFY_EMAIL, recipient: NOTIFY_EMAIL, reply_to: NOTIFY_EMAIL,
    to_name: 'Supervisor', from_name: 'Academia Monitoreo BESS',
    subject: 'Nueva Academia BESS — '+nombreP, title: 'Academia Monitoreo BESS',
    /* nombres comunes de plantilla (name/message) + los propios */
    name: nombreP, nombre: nombreP, rol: data.rol||'—',
    nivel: nivelP, score: scoreP, fecha: fechaP, caso: caso,
    message: mensaje, mensaje: mensaje
  };
  try{
    emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params)
      .then(function(r){ console.log('[EmailJS] enviado OK:', r&&r.status, r&&r.text); setSaveState('✓ Aviso enviado por correo a tu supervisor'); })
      .catch(function(err){ console.error('[EmailJS] ERROR =>', err); var t=(err&&(err.text||err.message))||(typeof err==='string'?err:JSON.stringify(err)); setSaveState('⚠ El correo no se envió — '+t); });
  }catch(e){ console.error('[EmailJS] excepción:', e); setSaveState('⚠ El correo no se envió — '+(e&&e.message||e)); }
}
function setSaveState(t){ var e=qs('save-state'); if(e)e.textContent=t; }

function initFirebase(cb){
  if(!FIREBASE_CONFIG.apiKey){ cb(); return; }
  var s1=document.createElement('script'); s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onload=function(){
    var s2=document.createElement('script'); s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
    s2.onload=function(){ try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); FB_ON=true; }catch(e){} cb(); };
    s2.onerror=cb; document.head.appendChild(s2);
  };
  s1.onerror=cb; document.head.appendChild(s1);
}

function renderSubs(list){
  list.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  window._supList=list;
  qs('st-total').textContent=list.length;
  var today=new Date().toDateString(), tN=list.filter(function(x){return new Date(x.ts||0).toDateString()===today;}).length;
  qs('st-today').textContent=tN;
  var withScore=list.filter(function(x){return x.scoreMax;});
  var avg=withScore.length?Math.round(withScore.reduce(function(a,x){return a+(x.scoreTotal/x.scoreMax*100);},0)/withScore.length):0;
  qs('st-avg').textContent=withScore.length?(avg+'%'):'—';
  qs('sub-list').innerHTML=list.map(function(x){
    var qa=OPEN_Q.map(function(q){ var a=(x.respuestas||{})[q.id]; if(!a)return ''; return '<div class="qa"><div class="qq">'+esc(q.label)+'</div><div class="aa">'+esc(a)+'</div></div>'; }).join('');
    var d=new Date(x.ts||0), nv=x.nivel||{};
    var mods=(x.modulos||[]).map(function(m){ return '<span class="mod-chip">'+m.num+' <b>'+m.score+'/'+m.total+'</b></span>'; }).join('');
    var glob=(x.scoreMax?('Global '+x.scoreTotal+'/'+x.scoreMax):'');
    return '<div class="sub-card"><div class="sub-head"><div class="sub-name">'+esc(x.nombre||'Sin nombre')+' <span class="tag">'+esc(x.rol||'—')+'</span></div>'+
      '<div class="sub-meta">'+d.toLocaleString('es-MX')+(glob?' · '+glob:'')+'</div></div>'+
      '<div class="sub-meta" style="margin-bottom:6px">Base: '+esc(nv.elec||'?')+' · Sabe BESS: '+esc(nv.sabeBess||'?')+' · Sabe solar: '+esc(nv.sabePv||'?')+'</div>'+
      (mods?'<div class="mod-chips">'+mods+'</div>':'')+qa+'</div>';
  }).join('')||'<p style="color:var(--t3)">Aún no hay respuestas.</p>';
}
/* Descargar todas las respuestas como CSV (se abre en Excel). */
window.exportCSV=function(){
  var list=(window._supList||[]).slice();
  if(!list.length){ alert('Aún no hay respuestas para descargar.'); return; }
  var cols=['Fecha','Nombre','Rol','Base eléctrica','Sabe BESS','Sabe solar','Puntaje global'];
  MOD.forEach(function(m){ cols.push('P'+m.num+' '+m.title); });
  cols.push('Caso (rack 0 A)');
  function cell(v){ v=String(v==null?'':v).replace(/"/g,'""'); return '"'+v+'"'; }
  var rows=[cols.map(cell).join(',')];
  list.forEach(function(x){
    var nv=x.nivel||{}, mm={}; (x.modulos||[]).forEach(function(m){ mm[m.num]=m.score+'/'+m.total; });
    var r=[ new Date(x.ts||0).toLocaleString('es-MX'), x.nombre||'', x.rol||'', nv.elec||'', nv.sabeBess||'', nv.sabePv||'',
      (x.scoreMax?(x.scoreTotal+'/'+x.scoreMax):'') ];
    MOD.forEach(function(m){ r.push(mm[m.num]||''); });
    r.push((x.respuestas&&x.respuestas.q_caso)||'');
    rows.push(r.map(cell).join(','));
  });
  var csv='﻿'+rows.join('\r\n'); /* BOM para acentos en Excel */
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='academia_bess_resultados_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};
function loadSubs(){
  if(FB_ON&&db){
    qs('live-tag').classList.remove('hidden');
    db.collection('respuestas_induccion').onSnapshot(function(snap){ var l=[];snap.forEach(function(d){l.push(d.data());});renderSubs(l); });
  } else {
    qs('live-tag').classList.add('hidden');
    var l=[]; try{ l=JSON.parse(localStorage.getItem('sky_induccion')||'[]'); }catch(e){}
    renderSubs(l);
    var note=qs('sup-mode'); note.classList.remove('hidden');

  }
}

/* Entrada inteligente:
   - Si ya completó las 8 paradas → va directo a su ruta final (certificado + respuestas).
   - Si ya llenó el inicio (nombre/rol/experiencia) pero le faltan paradas → va directo al mapa.
   - Solo la primera vez ve la bienvenida y los datos del inicio. */
if(_isAdmin()){ VIEW='adminhome'; }   /* el admin elige: ver supervisor o hacer el test */
else if(allDone()){ VIEW='final'; }
else if(profileDone()){ VIEW='map'; }
initFirebase(function(){ render(); _checkSupHash(); try{ if(VIEW!=='hero') _acaSync(); }catch(e){} });
initEmail();
</script>
